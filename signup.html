<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up - Richfield Connect</title>
        <link rel="icon" type="image/png" href="Images/logo.jfif">

        <link rel="stylesheet" href="Assets/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="./Assets/script.js" defer></script>
    </head>
    <body>
        <header class="about-header">

            <!-- MAIN NAVIGATION -->

            <nav class="nav-bar">
                <div class="logo">
                    <img src="Images/logo-richfield.png" alt="Richfield Connect Logo">
                </div>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="feed.html">Feed</a></li>
                    <li><a href="signup.html" class="active">Sign Up</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>

        </header>

        <main class="signup-container">
            <h1>Create an Account</h1>
            <p>Join the Richfield Connect.</p>

            <form action="#" method="post" class="signup-form" id="signupForm">
                <div class="form-group">
                    <label for="fullname">Full Name *</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Name & Surname" required>
                </div>

                <div class="form-group">
                    <label for="student-number">Student Number *</label>
                    <input type="text" id="student-number" name="student-number" inputmode="numeric" maxlength="8" placeholder="40120222" required>
                </div>

                <div class="form-group">
                    <label for="campus">Campus *</label>
                    <select id="campus" name="campus" required>
                        <option value="" disabled selected>Select your campus</option>
                        <option value="braamfontein">Braamfontein</option>
                        <option value="Polokwane">Polokwane</option>
                        <option value="Cape Town">Cape Town</option>
                        <option value="Pretoria">Pretoria</option>
                        <option value="Durban">Durban</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="studentnumber@my.richfield.ac.za" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" minlength="8" placeholder="Minimum 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" name="confirm-password" minlength="8" placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label>Interest</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="interest" value="web-development"> Web Development</label>
                        <label><input type="checkbox" name="interest" value="cyber-security"> Cyber Security</label>
                        <label><input type="checkbox" name="interest" value="data-science"> Data Science</label>
                        <label><input type="checkbox" name="interest" value="cloud-computing"> Cloud Computing</label>
                        <label><input type="checkbox" name="interest" value="Computer-networking"> Computer Networking</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Tell us a little about yourself."></textarea>
                </div>

                <div class="form-group check-single">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="about.html">Terms and Conditions *</a></label>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

        </main>

        <footer class="main-footer">
            <p>&copy; 2026 Richfield Connect. All rights reserved.</p>
        </footer>
    </body>
</html>
